<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabellone Karate WKF</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    background: #1e1e1e;
    color: #ffffff;
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  .top-bar {
    background: #111;
    padding: 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-bottom: 2px solid #333;
  }
  .category-bar {
    background: #222;
    padding: 10px;
    display: flex;
    justify-content: center;
    gap: 15px;
    border-bottom: 2px solid #333;
  }
  .timer-container {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .timer {
    font-size: 5em;
    font-weight: bold;
    font-family: monospace;
    background: #000;
    padding: 5px 30px;
    border-radius: 10px;
    color: #ffeb3b;
    min-width: 250px;
    transition: color 0.3s ease; /* Transizione fluida per il cambio colore */
  }
  .space-hint {
    font-size: 0.8em;
    color: #888;
    margin-top: 5px;
    font-weight: normal;
  }
  .status-banner {
    font-size: 1.5em;
    font-weight: bold;
    height: 30px; 
    margin-top: 5px;
    text-transform: uppercase;
  }
  .controls button {
    font-size: 1.1em;
    margin: 5px;
    padding: 10px 15px;
    cursor: pointer;
    background: #333;
    color: white;
    border: 1px solid #555;
    border-radius: 5px;
  }
  .controls button:hover { background: #444; }
  .controls input[type="number"] {
    font-size: 1.1em;
    padding: 8px;
    width: 60px;
    text-align: center;
    border-radius: 5px;
    border: 1px solid #555;
    background: #222;
    color: white;
  }
  .scoreboard {
    display: flex;
    flex: 1;
  }
  .side {
    flex: 1;
    padding: 15px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  .aka { background-color: #d32f2f; }
  .ao { background-color: #1976d2; }
  
  .name-input {
    font-size: 2.5em;
    font-weight: bold;
    background: transparent;
    border: none;
    color: white;
    text-align: center;
    width: 80%;
    margin-bottom: 5px;
    border-bottom: 2px dashed rgba(255,255,255,0.4);
    font-family: inherit;
  }
  .name-input:focus {
    outline: none;
    border-bottom: 2px solid white;
    background: rgba(0,0,0,0.1);
  }

  .score {
    font-size: 9em;
    font-weight: bold;
    margin: 0;
    line-height: 1;
  }
  
  /* Animazione lampeggio punteggio */
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  .blinking {
    animation: blink 1s infinite;
  }

  .point-btns button {
    font-size: 1.2em;
    margin: 5px;
    padding: 8px 12px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
    border: none;
    background: rgba(255, 255, 255, 0.2);
    color: white;
  }
  .point-btns button:hover { background: rgba(255, 255, 255, 0.4); }
  .senshu-badge {
    font-size: 2em;
    color: #ffeb3b;
    font-weight: bold;
    visibility: hidden;
    margin-bottom: 0px;
  }
  .senshu-badge.active { visibility: visible; }
  
  .penalty-container {
    margin-top: 10px;
    background: rgba(0,0,0,0.3);
    padding: 10px 20px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .penalties {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .penalty-box {
    width: 25px;
    height: 25px;
    border: 3px solid white;
    border-radius: 50%;
  }
  .penalty-box.filled { background: #ffeb3b; border-color: #ffeb3b; }
  .penalty-box.fatal { background: #000; border-color: #000; }
  
  .history-section {
    background: #222;
    height: 22vh;
    padding: 10px 20px;
    overflow-y: auto;
    text-align: left;
    border-top: 2px solid #444;
  }
  .history-entry {
    background: #333;
    padding: 10px;
    margin-bottom: 5px;
    border-radius: 5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
</style>
</head>
<body>

  <!-- Barra Categorie -->
  <div class="category-bar controls">
    <button onclick="setCategory(1, 30)" style="background: #2196F3;">Combattimento U14 (1:30)</button>
    <button onclick="setCategory(2, 0)" style="background: #9C27B0;">Cadetti/Juniores (2:00)</button>
    <button onclick="setCategory(3, 0)" style="background: #FF9800;">Seniores (3:00)</button>
    <span style="border-left: 2px solid #555; margin: 0 10px;"></span>
    <button onclick="resetNames()" style="background: #607D8B;">Reimposta Nomi</button>
  </div>

  <!-- Barra Superiore: Timer e Controlli -->
  <div class="top-bar controls">
    <div style="display: flex; align-items: center; gap: 5px;">
      <input type="number" id="minutesInput" value="3" min="0" title="Minuti"> m
      <input type="number" id="secondsInput" value="0" min="0" max="59" title="Secondi"> s
      <button onclick="setTime()" style="margin-left: 10px;">Imposta Durata</button>
    </div>
    
    <div class="timer-container">
      <div class="timer" id="timeDisplay">03:00,0</div>
      <div class="space-hint">(Premi SPAZIO per Avviare/Pausare)</div>
      <div class="status-banner" id="matchStatus"></div>
    </div>
    
    <div>
      <button onclick="toggleTimer()" id="startBtn">Avvia Tempo</button>
      <button onclick="addTime(15)">+15s</button>
      <button onclick="addTime(1)">+1s</button>
      <button onclick="addTime(-1)">-1s</button>
      <button onclick="resetMatch()">Reset Incontro</button>
    </div>
  </div>

  <!-- Tabellone Punteggi -->
  <div class="scoreboard">
    <!-- AKA (Rosso) -->
    <div class="side aka">
      <input type="text" class="name-input" id="akaName" value="AKA" placeholder="Nome Rosso">
      <div class="senshu-badge" id="akaSenshu">SENSHU</div>
      <div class="score" id="akaScore">0</div>
      <div class="point-btns">
        <button onclick="updateScore('aka', 1)">YUKO (+1)</button>
        <button onclick="updateScore('aka', 2)">WAZA-ARI (+2)</button>
        <button onclick="updateScore('aka', 3)">IPPON (+3)</button>
        <button onclick="updateScore('aka', -1)">-1 pt</button>
      </div>
      <button class="controls" style="margin-top:10px; padding:8px 15px;" onclick="toggleSenshu('aka')">Assegna Senshu</button>
      
      <div class="penalty-container">
        <div class="penalties" id="akaPenalties">
          <div class="penalty-box"></div>
          <div class="penalty-box"></div>
          <div class="penalty-box"></div>
          <div class="penalty-box"></div>
          <div class="penalty-box"></div>
        </div>
        <div class="point-btns">
          <button onclick="changePenalty('aka', 1)">+ Penalità</button>
          <button onclick="changePenalty('aka', -1)">- Penalità</button>
        </div>
      </div>
    </div>

    <!-- AO (Blu) -->
    <div class="side ao">
      <input type="text" class="name-input" id="aoName" value="AO" placeholder="Nome Blu">
      <div class="senshu-badge" id="aoSenshu">SENSHU</div>
      <div class="score" id="aoScore">0</div>
      <div class="point-btns">
        <button onclick="updateScore('ao', 1)">YUKO (+1)</button>
        <button onclick="updateScore('ao', 2)">WAZA-ARI (+2)</button>
        <button onclick="updateScore('ao', 3)">IPPON (+3)</button>
        <button onclick="updateScore('ao', -1)">-1 pt</button>
      </div>
      <button class="controls" style="margin-top:10px; padding:8px 15px;" onclick="toggleSenshu('ao')">Assegna Senshu</button>
      
      <div class="penalty-container">
        <div class="penalties" id="aoPenalties">
          <div class="penalty-box"></div>
          <div class="penalty-box"></div>
          <div class="penalty-box"></div>
          <div class="penalty-box"></div>
          <div class="penalty-box"></div>
        </div>
        <div class="point-btns">
          <button onclick="changePenalty('ao', 1)">+ Penalità</button>
          <button onclick="changePenalty('ao', -1)">- Penalità</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Storico e Salvataggio -->
  <div class="top-bar controls" style="justify-content: center; background: #1a1a1a;">
    <button onclick="saveMatch()" style="background: #4CAF50; font-weight:bold;">Salva Risultato in Storico</button>
    <button onclick="clearHistory()" style="background: #f44336;">Pulisci Storico</button>
  </div>
  <div class="history-section" id="historyLog">
    <h3 style="margin-top:0;">Storico Incontri</h3>
    <div id="historyEntries"></div>
  </div>

  <script>
    // --- VARIABILI DI STATO ---
    let timeRemainingMs = 180000;
    let expectedEndTime = 0;
    let timerInterval = null;
    let isRunning = false;
    let atoshiBarakuPlayed = false; 
    let audioCtx = null;
    
    let scores = { aka: 0, ao: 0 };
    let penalties = { aka: 0, ao: 0 };
    let senshu = null;

    window.onload = function() {
      renderHistory();
      updateDisplay();
    };

    // --- CONTROLLO TASTIERA ---
    document.addEventListener('keydown', function(event) {
      if (event.target.tagName.toLowerCase() === 'input') return; 
      
      if (event.code === 'Space' || event.key === ' ') {
        event.preventDefault(); 
        toggleTimer();
      }
    });

    // --- FUNZIONI CATEGORIE E NOMI ---
    function setCategory(minutes, seconds) {
      document.getElementById('minutesInput').value = minutes;
      document.getElementById('secondsInput').value = seconds;
      resetMatch(); 
    }

    function resetNames() {
      document.getElementById('akaName').value = 'AKA';
      document.getElementById('aoName').value = 'AO';
    }

    // --- LOGICA VINCITORE ---
    function determineWinner() {
      if (penalties.aka >= 5) return 'ao';
      if (penalties.ao >= 5) return 'aka';
      if (scores.aka > scores.ao) return 'aka';
      if (scores.ao > scores.aka) return 'ao';
      if (senshu === 'aka') return 'aka';
      if (senshu === 'ao') return 'ao';
      return 'tie';
    }

    function showWinnerUI() {
      let winner = determineWinner();
      let statusDiv = document.getElementById('matchStatus');
      let akaName = document.getElementById('akaName').value || 'AKA';
      let aoName = document.getElementById('aoName').value || 'AO';

      // Rimuovi eventuali lampeggi precedenti
      document.getElementById('akaScore').classList.remove('blinking');
      document.getElementById('aoScore').classList.remove('blinking');

      if (winner === 'aka') {
        statusDiv.innerText = "🏆 VINCE: " + akaName;
        statusDiv.style.color = "#ff6b6b";
        document.getElementById('akaScore').classList.add('blinking');
      } else if (winner === 'ao') {
        statusDiv.innerText = "🏆 VINCE: " + aoName;
        statusDiv.style.color = "#64b5f6";
        document.getElementById('aoScore').classList.add('blinking');
      } else {
        statusDiv.innerText = "⚖️ PAREGGIO (HANTEI)";
        statusDiv.style.color = "#ffffff";
      }
    }

    function clearWinnerUI() {
      document.getElementById('matchStatus').innerText = ""; 
      document.getElementById('akaScore').classList.remove('blinking');
      document.getElementById('aoScore').classList.remove('blinking');
    }

    // --- MOTORE AUDIO ---
    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        let osc = audioCtx.createOscillator();
        osc.connect(audioCtx.destination);
        
        if (type === '15s') {
          osc.frequency.value = 600; 
          osc.start();
          setTimeout(() => osc.stop(), 400); 
        } else if (type === 'end') {
          osc.frequency.value = 800; 
          osc.start();
          setTimeout(() => osc.stop(), 1500); 
        }
      } catch(e) {
        console.log("Audio non supportato o bloccato:", e);
      }
    }

    // --- MOTORE TEMPO ---
    function updateDisplay() {
      if (timeRemainingMs < 0) timeRemainingMs = 0;
      
      let totalSeconds = timeRemainingMs / 1000;
      let m = Math.floor(totalSeconds / 60);
      let s = Math.floor(totalSeconds % 60);
      let decimo = Math.floor((timeRemainingMs % 1000) / 100); 
      
      let mStr = m < 10 ? '0' + m : m;
      let sStr = s < 10 ? '0' + s : s;

      let timerElement = document.getElementById('timeDisplay');
      timerElement.innerText = mStr + ':' + sStr + ',' + decimo;

      // Colora di rosso se mancano 15 secondi o meno
      if (timeRemainingMs <= 15000 && timeRemainingMs >= 0) {
        timerElement.style.color = "#ff5252"; // Rosso acceso
      } else {
        timerElement.style.color = "#ffeb3b"; // Giallo normale
      }
    }

    function toggleTimer() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (isRunning) {
        clearInterval(timerInterval);
        document.getElementById('startBtn').innerText = "Avvia Tempo";
        document.getElementById('startBtn').style.background = "#333";
      } else {
        if (timeRemainingMs <= 0) return;
        clearWinnerUI(); 
        expectedEndTime = Date.now() + timeRemainingMs;
        
        timerInterval = setInterval(() => {
          timeRemainingMs = expectedEndTime - Date.now();
          
          if (timeRemainingMs <= 15000 && !atoshiBarakuPlayed && timeRemainingMs > 0) {
            playSound('15s');
            atoshiBarakuPlayed = true;
          }

          if (timeRemainingMs <= 0) {
            timeRemainingMs = 0;
            clearInterval(timerInterval);
            isRunning = false;
            document.getElementById('startBtn').innerText = "Tempo Scaduto";
            document.getElementById('startBtn').style.background = "#333";
            playSound('end');
            showWinnerUI(); 
          }
          updateDisplay();
        }, 10);
        
        document.getElementById('startBtn').innerText = "Pausa";
        document.getElementById('startBtn').style.background = "#d32f2f";
      }
      isRunning = !isRunning;
    }

    function setTime() {
      let min = parseInt(document.getElementById('minutesInput').value);
      let sec = parseInt(document.getElementById('secondsInput').value);
      
      if (isNaN(min) || min < 0) min = 0;
      if (isNaN(sec) || sec < 0) sec = 0;
      
      if (min === 0 && sec === 0) {
          min = 3; 
          document.getElementById('minutesInput').value = 3;
      }

      timeRemainingMs = (min * 60000) + (sec * 1000);
      
      if (timeRemainingMs > 15000) {
          atoshiBarakuPlayed = false;
      }
      
      if (isRunning) toggleTimer();
      updateDisplay();
      clearWinnerUI();
    }

    function addTime(seconds) {
      timeRemainingMs += seconds * 1000;
      if (timeRemainingMs < 0) timeRemainingMs = 0;
      
      if (timeRemainingMs > 15000) {
          atoshiBarakuPlayed = false;
      }
      
      if (isRunning) {
          expectedEndTime += seconds * 1000;
      }
      updateDisplay();
      clearWinnerUI();
    }

    // --- PUNTEGGI E PENALITÀ ---
    function updateScore(player, points) {
      scores[player] += points;
      if (scores[player] < 0) scores[player] = 0;
      document.getElementById(player + 'Score').innerText = scores[player];
    }

    function toggleSenshu(player) {
      document.getElementById('akaSenshu').classList.remove('active');
      document.getElementById('aoSenshu').classList.remove('active');
      
      if (senshu === player) {
        senshu = null;
      } else {
        senshu = player;
        document.getElementById(player + 'Senshu').classList.add('active');
      }
    }

    function changePenalty(player, delta) {
      penalties[player] += delta;
      
      if (penalties[player] > 5) penalties[player] = 5;
      if (penalties[player] < 0) penalties[player] = 0;
      
      let boxes = document.getElementById(player + 'Penalties').children;
      for (let i = 0; i < 5; i++) {
        boxes[i].classList.remove('filled', 'fatal');
        if (i < penalties[player]) {
            if (i === 4) {
                boxes[i].classList.add('fatal');
            } else {
                boxes[i].classList.add('filled');
            }
        }
      }
      
      if((penalties.aka === 5 || penalties.ao === 5) && !isRunning && timeRemainingMs > 0) {
          showWinnerUI();
      }
    }

    function resetMatch() {
      if (isRunning) toggleTimer();
      scores = { aka: 0, ao: 0 };
      penalties = { aka: 0, ao: 0 };
      senshu = null;
      atoshiBarakuPlayed = false; 
      
      document.getElementById('akaScore').innerText = 0;
      document.getElementById('aoScore').innerText = 0;
      document.getElementById('akaSenshu').classList.remove('active');
      document.getElementById('aoSenshu').classList.remove('active');
      clearWinnerUI();
      
      changePenalty('aka', 0);
      changePenalty('ao', 0);
      
      setTime(); 
    }

    // --- STORICO ---
    function saveMatch() {
      let history = JSON.parse(localStorage.getItem('karateHistory')) || [];
      let date = new Date().toLocaleString();
      let senshuTextAka = senshu === 'aka' ? ' (Senshu)' : '';
      let senshuTextAo = senshu === 'ao' ? ' (Senshu)' : '';
      
      let akaName = document.getElementById('akaName').value || 'AKA';
      let aoName = document.getElementById('aoName').value || 'AO';
      
      let winnerCode = determineWinner();
      let winnerText = "";
      if (winnerCode === 'aka') winnerText = "🏆 " + akaName;
      else if (winnerCode === 'ao') winnerText = "🏆 " + aoName;
      else winnerText = "⚖️ Pareggio";

      let matchData = {
        date: date,
        akaName: akaName,
        aoName: aoName,
        akaScore: scores.aka + senshuTextAka,
        aoScore: scores.ao + senshuTextAo,
        akaPenalties: penalties.aka,
        aoPenalties: penalties.ao,
        winnerInfo: winnerText
      };
      
      history.push(matchData);
      localStorage.setItem('karateHistory', JSON.stringify(history));
      renderHistory();
      resetMatch();
    }

    function renderHistory() {
      let history = JSON.parse(localStorage.getItem('karateHistory')) || [];
      let container = document.getElementById('historyEntries');
      container.innerHTML = '';
      
      history.slice().reverse().forEach((match) => {
        if(!match) return;
        let div = document.createElement('div');
        div.className = 'history-entry';
        
        div.innerHTML = `
          <div style="flex:1;">
            <span><strong>${match.date || ''}</strong></span><br>
            <span style="color:#ffeb3b; font-weight:bold; font-size:1.1em;">${match.winnerInfo || ''}</span>
          </div>
          <div style="flex:2; text-align:right;">
            <span style="color:#ff6b6b; font-weight:bold;">${match.akaName || 'AKA'}: ${match.akaScore || 0} (Pen: ${match.akaPenalties || 0}/5)</span>
            <span> VS </span>
            <span style="color:#64b5f6; font-weight:bold;">${match.aoName || 'AO'}: ${match.aoScore || 0} (Pen: ${match.aoPenalties || 0}/5)</span>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function clearHistory() {
      if(confirm("Sei sicuro di voler eliminare tutto lo storico?")) {
        localStorage.removeItem('karateHistory');
        renderHistory();
      }
    }
  </script>
</body>
</html>
