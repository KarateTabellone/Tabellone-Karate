<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tabellone Karate WKF</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    background: #1e1e1e;
    color: #ffffff;
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  
  /* --- Avviso Rotazione Schermo --- */
  #portraitWarning {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: #111; color: white;
    z-index: 9999;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px; box-sizing: border-box;
  }
  @media screen and (orientation: portrait) {
    #portraitWarning { display: flex; }
    .main-content { display: none !important; }
  }

  .main-content {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
  }

  .top-bar {
    background: #111;
    padding: 10px 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    border-bottom: 2px solid #333;
  }
  
  .category-bar {
    background: #222;
    padding: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    border-bottom: 2px solid #333;
  }

  .controls button {
    font-size: 1.1em;
    margin: 3px;
    padding: 10px 15px;
    cursor: pointer;
    background: #333;
    color: white;
    border: 1px solid #555;
    border-radius: 5px;
  }
  .controls button:hover { background: #444; }
  .controls input[type="number"] {
    font-size: 1.1em;
    padding: 8px;
    width: 60px;
    text-align: center;
    border-radius: 5px;
    border: 1px solid #555;
    background: #222;
    color: white;
  }

  /* --- ZONA PUNTEGGI E TIMER CENTRALE --- */
  .scoreboard {
    display: flex;
    flex: 1;
    justify-content: space-between;
  }
  
  .side {
    flex: 1;
    padding: 15px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  .aka { background-color: #d32f2f; }
  .ao { background-color: #1976d2; }
  
  .center-board {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #151515;
    padding: 0 20px;
    min-width: 300px;
    border-left: 3px solid #333;
    border-right: 3px solid #333;
    z-index: 10;
  }

  .timer {
    font-size: 8vw;
    font-weight: bold;
    font-family: monospace;
    background: #000;
    padding: 10px 30px;
    border-radius: 15px;
    color: #ffeb3b;
    transition: color 0.3s ease;
    line-height: 1;
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
  }
  
  .space-hint {
    font-size: 1em;
    color: #888;
    margin-top: 15px;
    font-weight: normal;
  }
  
  .status-banner {
    font-size: 2em;
    font-weight: bold;
    height: 40px; 
    margin-top: 15px;
    text-transform: uppercase;
    text-align: center;
  }

  .name-input {
    font-size: 3em;
    font-weight: bold;
    background: transparent;
    border: none;
    color: white;
    text-align: center;
    width: 90%;
    margin-bottom: 5px;
    border-bottom: 2px dashed rgba(255,255,255,0.4);
    font-family: inherit;
  }
  .name-input:focus {
    outline: none;
    border-bottom: 2px solid white;
    background: rgba(0,0,0,0.1);
  }

  .score {
    font-size: 11vw;
    font-weight: bold;
    margin: 0;
    line-height: 1;
  }
  
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  .blinking {
    animation: blink 1s infinite;
  }

  .point-btns button {
    font-size: 1.1em;
    margin: 3px;
    padding: 8px 12px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
    border: none;
    background: rgba(255, 255, 255, 0.2);
    color: white;
  }
  .point-btns button:hover { background: rgba(255, 255, 255, 0.4); }
  
  .senshu-badge {
    font-size: 2em;
    color: #ffeb3b;
    font-weight: bold;
    visibility: hidden;
    margin-bottom: 0px;
  }
  .senshu-badge.active { visibility: visible; }
  
  .penalty-container {
    margin-top: 10px;
    background: rgba(0,0,0,0.3);
    padding: 10px 20px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .penalties {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .penalty-box {
    width: 25px;
    height: 25px;
    border: 3px solid white;
    border-radius: 50%;
  }
  .penalty-box.filled { background: #ffeb3b; border-color: #ffeb3b; }
  .penalty-box.fatal { background: #000; border-color: #000; }
  
  .history-section {
    background: #222;
    height: 15vh;
    padding: 10px 20px;
    overflow-y: auto;
    text-align: left;
    border-top: 2px solid #444;
  }
  .history-entry {
    background: #333;
    padding: 10px;
    margin-bottom: 5px;
    border-radius: 5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* --- MODALITÀ DISPLAY (Finestra del Pubblico) --- */
  body.display-mode .controls, 
  body.display-mode .category-bar,
  body.display-mode .top-bar,
  body.display-mode .point-btns,
  body.display-mode .history-section,
  body.display-mode .space-hint,
  body.display-mode #portraitWarning {
      display: none !important;
  }
  body.display-mode .scoreboard {
      height: 100vh;
      margin: 0;
      padding: 0;
  }
  body.display-mode .center-board {
      border: none;
      background: #111;
  }
  body.display-mode .name-input {
      border-bottom: none;
      pointer-events: none;
      font-size: 5vw;
  }
  body.display-mode .score {
      font-size: 18vw; 
  }
  body.display-mode .timer {
      font-size: 12vw;
  }

  /* --- DESIGN RESPONSIVE PER TELEFONI IN ORIZZONTALE --- */
  @media screen and (max-height: 600px), screen and (max-width: 900px) {
    .timer { font-size: 4.5em; padding: 5px 15px; }
    .score { font-size: 5em; }
    .name-input { font-size: 1.5em; width: 90%; }
    .top-bar, .category-bar { padding: 5px; gap: 10px; }
    .controls button { font-size: 0.85em; padding: 5px 10px; margin: 2px; }
    .controls input[type="number"] { font-size: 0.9em; padding: 4px; width: 45px; }
    .point-btns button { font-size: 0.85em; padding: 4px 8px; margin: 2px; }
    .senshu-badge { font-size: 1.2em; margin-bottom: 2px; }
    .penalty-box { width: 15px; height: 15px; border-width: 2px; }
    .side { padding: 5px; }
    .center-board { padding: 0 10px; min-width: 180px; }
    .history-section { height: 12vh; padding: 5px 10px; }
    .history-entry { padding: 5px; font-size: 0.8em; }
    .status-banner { font-size: 1.2em; height: 25px; margin-top: 5px; }
    body:not(.display-mode) .space-hint { display: none; } 
  }
</style>
</head>
<body>

  <div id="portraitWarning">
    <div style="font-size: 4em; margin-bottom: 10px;">🔄</div>
    <h2>Ruota il dispositivo</h2>
    <p>Il tabellone deve essere utilizzato in modalità orizzontale.</p>
    <button onclick="goFullscreen()" style="margin-top:20px; padding: 15px 30px; font-size: 1.2em; font-weight: bold; cursor: pointer; background: #4CAF50; border: none; color: white; border-radius: 10px;">
      Forza Schermo Intero
    </button>
  </div>

  <div class="main-content">
    
    <!-- Barra Categorie (Invisibile sul Display Pubblico) -->
    <div class="category-bar controls">
      <button onclick="openDisplayWindow()" style="background: #E91E63; font-weight: bold; font-size: 1.2em;">🖥️ Apri Schermo Pubblico</button>
      <span style="border-left: 2px solid #555; margin: 0 5px; height: 30px;"></span>
      <button onclick="goFullscreen()" style="background: #4CAF50; font-weight: bold;">📱 Fullscreen</button>
      <span style="border-left: 2px solid #555; margin: 0 5px; height: 30px;"></span>
      <button onclick="setCategory(1, 30)" style="background: #2196F3;">U14 (1:30)</button>
      <button onclick="setCategory(2, 0)" style="background: #9C27B0;">Cad/Jun (2:00)</button>
      <button onclick="setCategory(3, 0)" style="background: #FF9800;">Seniores (3:00)</button>
    </div>

    <!-- Barra Controlli Principali -->
    <div class="top-bar controls">
      <div style="display: flex; align-items: center; gap: 5px;">
        <input type="number" id="minutesInput" value="3" min="0" title="Minuti"> m
        <input type="number" id="secondsInput" value="0" min="0" max="59" title="Secondi"> s
        <button onclick="setTime()" style="margin-left: 5px; background: #1976d2;">Imposta Tempo</button>
      </div>
      
      <div>
        <button onclick="toggleTimer()" id="startBtn" style="background: #d84315; font-weight: bold;">Avvia Tempo</button>
        <button onclick="addTime(15)">+15s</button>
        <button onclick="addTime(1)">+1s</button>
        <button onclick="addTime(-1)">-1s</button>
      </div>

      <!-- Zona dei RESET raggruppata a destra -->
      <div>
        <button onclick="resetNames()" style="background: #607D8B;">Reset Nomi</button>
        <button onclick="resetPoints('both')" style="background: #666;">Azzera Punti</button>
        <button onclick="resetMatch()" style="background: #b71c1c;">Reset Incontro</button>
      </div>
    </div>

    <!-- Tabellone (Diventa a tutto schermo in Modalità Display) -->
    <div class="scoreboard">
      
      <div class="side aka">
        <input type="text" class="name-input" id="akaName" value="AKA" placeholder="Nome Rosso" oninput="broadcastState()">
        <div class="senshu-badge" id="akaSenshu">SENSHU</div>
        <div class="score" id="akaScore">0</div>
        <div class="point-btns">
          <button onclick="updateScore('aka', 1)">YUKO (+1)</button>
          <button onclick="updateScore('aka', 2)">WAZA-ARI (+2)</button>
          <button onclick="updateScore('aka', 3)">IPPON (+3)</button>
          <button onclick="updateScore('aka', -1)">-1 pt</button>
          <button onclick="resetPoints('aka')" style="background: #9a0000; font-size: 0.9em;">Reset Punti</button>
        </div>
        <button class="controls" style="margin-top:10px; padding:8px 15px;" onclick="toggleSenshu('aka')">Assegna Senshu</button>
        
        <div class="penalty-container">
          <div class="penalties" id="akaPenalties">
            <div class="penalty-box"></div>
            <div class="penalty-box"></div>
            <div class="penalty-box"></div>
            <div class="penalty-box"></div>
            <div class="penalty-box"></div>
          </div>
          <div class="point-btns">
            <button onclick="changePenalty('aka', 1)">+ Penalità</button>
            <button onclick="changePenalty('aka', -1)">- Penalità</button>
          </div>
        </div>
      </div>

      <!-- TIMER CENTRALE -->
      <div class="center-board">
        <div class="timer" id="timeDisplay">03:00,0</div>
        <div class="status-banner" id="matchStatus"></div>
        <div class="space-hint">(Premi SPAZIO per Avviare/Pausare)</div>
      </div>

      <div class="side ao">
        <input type="text" class="name-input" id="aoName" value="AO" placeholder="Nome Blu" oninput="broadcastState()">
        <div class="senshu-badge" id="aoSenshu">SENSHU</div>
        <div class="score" id="aoScore">0</div>
        <div class="point-btns">
          <button onclick="updateScore('ao', 1)">YUKO (+1)</button>
          <button onclick="updateScore('ao', 2)">WAZA-ARI (+2)</button>
          <button onclick="updateScore('ao', 3)">IPPON (+3)</button>
          <button onclick="updateScore('ao', -1)">-1 pt</button>
          <button onclick="resetPoints('ao')" style="background: #003c8f; font-size: 0.9em;">Reset Punti</button>
        </div>
        <button class="controls" style="margin-top:10px; padding:8px 15px;" onclick="toggleSenshu('ao')">Assegna Senshu</button>
        
        <div class="penalty-container">
          <div class="penalties" id="aoPenalties">
            <div class="penalty-box"></div>
            <div class="penalty-box"></div>
            <div class="penalty-box"></div>
            <div class="penalty-box"></div>
            <div class="penalty-box"></div>
          </div>
          <div class="point-btns">
            <button onclick="changePenalty('ao', 1)">+ Penalità</button>
            <button onclick="changePenalty('ao', -1)">- Penalità</button>
          </div>
        </div>
      </div>

    </div>

    <!-- Storico e Salvataggio -->
    <div class="top-bar controls" style="justify-content: center; background: #1a1a1a; padding: 5px;">
      <button onclick="saveMatch()" style="background: #4CAF50; font-weight:bold;">Salva Risultato in Storico</button>
      <button onclick="clearHistory()" style="background: #f44336;">Pulisci Storico</button>
    </div>
    <div class="history-section" id="historyLog">
      <h3 style="margin-top:0; margin-bottom: 5px;">Storico Incontri</h3>
      <div id="historyEntries"></div>
    </div>
  </div>

  <script>
    // --- GESTIONE DUAL-SCREEN E SINCRONIZZAZIONE ---
    const urlParams = new URLSearchParams(window.location.search);
    const isDisplayMode = urlParams.get('view') === 'display';
    const bc = new BroadcastChannel('wkf_scoreboard_channel');
    let displayWindow = null;

    // --- VARIABILI DI STATO ---
    let timeRemainingMs = 180000;
    let expectedEndTime = 0;
    let timerInterval = null;
    let isRunning = false;
    let atoshiBarakuPlayed = false; 
    let audioCtx = null;
    let scores = { aka: 0, ao: 0 };
    let penalties = { aka: 0, ao: 0 };
    let senshu = null;

    window.onload = function() {
      if (isDisplayMode) {
        document.body.classList.add('display-mode');
        bc.postMessage({ type: 'REQUEST_SYNC' });
        
        bc.onmessage = function(event) {
          if (event.data.type === 'SYNC') {
            updateDisplayFromSync(event.data);
          }
        };
      } else {
        renderHistory();
        updateDisplay();
        
        bc.onmessage = function(event) {
          if (event.data.type === 'REQUEST_SYNC') {
            broadcastState();
          }
        };
      }
    };

    // --- APERTURA SCHERMO PUBBLICO ---
    function openDisplayWindow() {
      if (!displayWindow || displayWindow.closed) {
        displayWindow = window.open(window.location.pathname + '?view=display', 'WKF_Display', 'width=1000,height=700');
        setTimeout(broadcastState, 500); 
      } else {
        displayWindow.focus(); 
      }
    }

    // --- FUNZIONE DI INVIO DATI AL DISPLAY ---
    function broadcastState() {
      if (isDisplayMode) return; 
      
      bc.postMessage({
        type: 'SYNC',
        timeText: document.getElementById('timeDisplay').innerText,
        timeColor: document.getElementById('timeDisplay').style.color,
        akaName: document.getElementById('akaName').value,
        aoName: document.getElementById('aoName').value,
        akaScore: scores.aka,
        aoScore: scores.ao,
        akaSenshu: senshu === 'aka',
        aoSenshu: senshu === 'ao',
        akaPenalties: penalties.aka,
        aoPenalties: penalties.ao,
        statusText: document.getElementById('matchStatus').innerText,
        statusColor: document.getElementById('matchStatus').style.color,
        akaBlinking: document.getElementById('akaScore').classList.contains('blinking'),
        aoBlinking: document.getElementById('aoScore').classList.contains('blinking')
      });
    }

    // --- FUNZIONE DI RICEZIONE DATI SUL DISPLAY ---
    function updateDisplayFromSync(data) {
      document.getElementById('timeDisplay').innerText = data.timeText;
      document.getElementById('timeDisplay').style.color = data.timeColor;
      document.getElementById('akaName').value = data.akaName;
      document.getElementById('aoName').value = data.aoName;
      document.getElementById('akaScore').innerText = data.akaScore;
      document.getElementById('aoScore').innerText = data.aoScore;
      
      document.getElementById('akaSenshu').classList.toggle('active', data.akaSenshu);
      document.getElementById('aoSenshu').classList.toggle('active', data.aoSenshu);
      
      updatePenaltiesVisuals('aka', data.akaPenalties);
      updatePenaltiesVisuals('ao', data.aoPenalties);
      
      document.getElementById('matchStatus').innerText = data.statusText;
      document.getElementById('matchStatus').style.color = data.statusColor;
      
      document.getElementById('akaScore').classList.toggle('blinking', data.akaBlinking);
      document.getElementById('aoScore').classList.toggle('blinking', data.aoBlinking);
    }

    function updatePenaltiesVisuals(player, penCount) {
      let boxes = document.getElementById(player + 'Penalties').children;
      for (let i = 0; i < 5; i++) {
        boxes[i].classList.remove('filled', 'fatal');
        if (i < penCount) {
            if (i === 4) boxes[i].classList.add('fatal');
            else boxes[i].classList.add('filled');
        }
      }
    }

    // --- FORZA SCHERMO INTERO E ROTAZIONE ---
    function goFullscreen() {
      let elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().then(() => {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock("landscape").catch((err) => console.log(err));
          }
        }).catch(err => console.log(err));
      } else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
    }

    // --- CONTROLLO TASTIERA ---
    document.addEventListener('keydown', function(event) {
      if (isDisplayMode) return; 
      if (event.target.tagName.toLowerCase() === 'input') return; 
      if (event.code === 'Space' || event.key === ' ') {
        event.preventDefault(); 
        toggleTimer();
      }
    });

    // --- LOGICA DEL TABELLONE ---
    function setCategory(minutes, seconds) {
      document.getElementById('minutesInput').value = minutes;
      document.getElementById('secondsInput').value = seconds;
      resetMatch(); 
    }

    function resetNames() {
      document.getElementById('akaName').value = 'AKA';
      document.getElementById('aoName').value = 'AO';
      broadcastState();
    }

    function resetPoints(target) {
      if (target === 'aka' || target === 'both') {
        scores.aka = 0;
        document.getElementById('akaScore').innerText = 0;
      }
      if (target === 'ao' || target === 'both') {
        scores.ao = 0;
        document.getElementById('aoScore').innerText = 0;
      }
      checkEndConditions();
      if (timeRemainingMs <= 0 && !isRunning) showWinnerUI();
      broadcastState();
    }

    function determineWinner() {
      if (penalties.aka >= 5) return 'ao';
      if (penalties.ao >= 5) return 'aka';
      if (scores.aka > scores.ao) return 'aka';
      if (scores.ao > scores.aka) return 'ao';
      if (senshu === 'aka') return 'aka';
      if (senshu === 'ao') return 'ao';
      return 'tie';
    }

    function showWinnerUI() {
      let winner = determineWinner();
      let statusDiv = document.getElementById('matchStatus');
      let akaName = document.getElementById('akaName').value || 'AKA';
      let aoName = document.getElementById('aoName').value || 'AO';

      document.getElementById('akaScore').classList.remove('blinking');
      document.getElementById('aoScore').classList.remove('blinking');

      if (winner === 'aka') {
        statusDiv.innerText = "🏆 VINCE: " + akaName;
        statusDiv.style.color = "#ff6b6b";
        document.getElementById('akaScore').classList.add('blinking');
      } else if (winner === 'ao') {
        statusDiv.innerText = "🏆 VINCE: " + aoName;
        statusDiv.style.color = "#64b5f6";
        document.getElementById('aoScore').classList.add('blinking');
      } else {
        statusDiv.innerText = "⚖️ PAREGGIO";
        statusDiv.style.color = "#ffffff";
      }
      broadcastState();
    }

    function clearWinnerUI() {
      document.getElementById('matchStatus').innerText = ""; 
      document.getElementById('akaScore').classList.remove('blinking');
      document.getElementById('aoScore').classList.remove('blinking');
      broadcastState();
    }

    function checkEndConditions() {
      let gap = Math.abs(scores.aka - scores.ao);
      let hansoku = penalties.aka >= 5 || penalties.ao >= 5;

      if (gap >= 8 || hansoku) {
          if (isRunning) toggleTimer(); 
          showWinnerUI();
      } else if (timeRemainingMs > 0) {
          clearWinnerUI();
      }
    }

    function playSound(type) {
      if (isDisplayMode) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        let osc = audioCtx.createOscillator();
        osc.connect(audioCtx.destination);
        if (type === '15s') { osc.frequency.value = 600; osc.start(); setTimeout(() => osc.stop(), 400); }
        else if (type === 'end') { osc.frequency.value = 800; osc.start(); setTimeout(() => osc.stop(), 1500); }
      } catch(e) {}
    }

    function updateDisplay() {
      if (timeRemainingMs < 0) timeRemainingMs = 0;
      let totalSeconds = timeRemainingMs / 1000;
      let m = Math.floor(totalSeconds / 60);
      let s = Math.floor(totalSeconds % 60);
      let decimo = Math.floor((timeRemainingMs % 1000) / 100); 
      let mStr = m < 10 ? '0' + m : m;
      let sStr = s < 10 ? '0' + s : s;

      let timerElement = document.getElementById('timeDisplay');
      timerElement.innerText = mStr + ':' + sStr + ',' + decimo;
      timerElement.style.color = (timeRemainingMs <= 15000 && timeRemainingMs >= 0) ? "#ff5252" : "#ffeb3b"; 
      
      broadcastState(); 
    }

    function toggleTimer() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (isRunning) {
        clearInterval(timerInterval);
        document.getElementById('startBtn').innerText = "Avvia Tempo";
        document.getElementById('startBtn').style.background = "#d84315";
      } else {
        if (timeRemainingMs <= 0) return;
        let gap = Math.abs(scores.aka - scores.ao);
        let hansoku = penalties.aka >= 5 || penalties.ao >= 5;
        if (gap >= 8 || hansoku) return;

        clearWinnerUI(); 
        expectedEndTime = Date.now() + timeRemainingMs;
        
        timerInterval = setInterval(() => {
          timeRemainingMs = expectedEndTime - Date.now();
          if (timeRemainingMs <= 15000 && !atoshiBarakuPlayed && timeRemainingMs > 0) {
            playSound('15s');
            atoshiBarakuPlayed = true;
          }
          if (timeRemainingMs <= 0) {
            timeRemainingMs = 0;
            clearInterval(timerInterval);
            isRunning = false;
            document.getElementById('startBtn').innerText = "Tempo Scaduto";
            document.getElementById('startBtn').style.background = "#333";
            playSound('end');
            showWinnerUI(); 
          }
          updateDisplay();
        }, 10);
        document.getElementById('startBtn').innerText = "Pausa";
        document.getElementById('startBtn').style.background = "#d32f2f";
      }
      isRunning = !isRunning;
      broadcastState();
    }

    function setTime() {
      let min = parseInt(document.getElementById('minutesInput').value);
      let sec = parseInt(document.getElementById('secondsInput').value);
      if (isNaN(min) || min < 0) min = 0;
      if (isNaN(sec) || sec < 0) sec = 0;
      if (min === 0 && sec === 0) { min = 3; document.getElementById('minutesInput').value = 3; }
      timeRemainingMs = (min * 60000) + (sec * 1000);
      if (timeRemainingMs > 15000) atoshiBarakuPlayed = false;
      if (isRunning) toggleTimer();
      updateDisplay();
      checkEndConditions();
    }

    function addTime(seconds) {
      timeRemainingMs += seconds * 1000;
      if (timeRemainingMs < 0) timeRemainingMs = 0;
      if (timeRemainingMs > 15000) atoshiBarakuPlayed = false;
      if (isRunning) expectedEndTime += seconds * 1000;
      updateDisplay();
      checkEndConditions();
    }

    function updateScore(player, points) {
      scores[player] += points;
      if (scores[player] < 0) scores[player] = 0;
      document.getElementById(player + 'Score').innerText = scores[player];
      checkEndConditions();
      broadcastState();
    }

    function toggleSenshu(player) {
      document.getElementById('akaSenshu').classList.remove('active');
      document.getElementById('aoSenshu').classList.remove('active');
      if (senshu === player) senshu = null;
      else {
        senshu = player;
        document.getElementById(player + 'Senshu').classList.add('active');
      }
      if(timeRemainingMs <= 0 && !isRunning) showWinnerUI();
      broadcastState();
    }

    function changePenalty(player, delta) {
      penalties[player] += delta;
      if (penalties[player] > 5) penalties[player] = 5;
      if (penalties[player] < 0) penalties[player] = 0;
      updatePenaltiesVisuals(player, penalties[player]);
      checkEndConditions();
      broadcastState();
    }

    function resetMatch() {
      if (isRunning) toggleTimer();
      scores = { aka: 0, ao: 0 };
      penalties = { aka: 0, ao: 0 };
      senshu = null;
      atoshiBarakuPlayed = false; 
      document.getElementById('akaScore').innerText = 0;
      document.getElementById('aoScore').innerText = 0;
      document.getElementById('akaSenshu').classList.remove('active');
      document.getElementById('aoSenshu').classList.remove('active');
      clearWinnerUI();
      updatePenaltiesVisuals('aka', 0);
      updatePenaltiesVisuals('ao', 0);
      setTime(); 
      document.getElementById('startBtn').innerText = "Avvia Tempo";
      document.getElementById('startBtn').style.background = "#d84315";
      broadcastState();
    }

    function saveMatch() {
      let history = JSON.parse(localStorage.getItem('karateHistory')) || [];
      let date = new Date().toLocaleString();
      let winnerCode = determineWinner();
      let winnerText = (winnerCode === 'aka') ? "🏆 " + (document.getElementById('akaName').value || 'AKA') : 
                       (winnerCode === 'ao') ? "🏆 " + (document.getElementById('aoName').value || 'AO') : "⚖️ Pareggio";

      history.push({
        date: date,
        akaName: document.getElementById('akaName').value || 'AKA',
        aoName: document.getElementById('aoName').value || 'AO',
        akaScore: scores.aka + (senshu === 'aka' ? ' (Senshu)' : ''),
        aoScore: scores.ao + (senshu === 'ao' ? ' (Senshu)' : ''),
        akaPenalties: penalties.aka,
        aoPenalties: penalties.ao,
        winnerInfo: winnerText
      });
      localStorage.setItem('karateHistory', JSON.stringify(history));
      renderHistory();
      resetMatch();
    }

    function renderHistory() {
      let history = JSON.parse(localStorage.getItem('karateHistory')) || [];
      let container = document.getElementById('historyEntries');
      container.innerHTML = '';
      history.slice().reverse().forEach((match) => {
        if(!match) return;
        let div = document.createElement('div');
        div.className = 'history-entry';
        div.innerHTML = `
          <div style="flex:1;">
            <span><strong>${match.date || ''}</strong></span><br>
            <span style="color:#ffeb3b; font-weight:bold; font-size:1.1em;">${match.winnerInfo || ''}</span>
          </div>
          <div style="flex:2; text-align:right;">
            <span style="color:#ff6b6b; font-weight:bold;">${match.akaName || 'AKA'}: ${match.akaScore || 0} (Pen: ${match.akaPenalties || 0}/5)</span>
            <span> VS </span>
            <span style="color:#64b5f6; font-weight:bold;">${match.aoName || 'AO'}: ${match.aoScore || 0} (Pen: ${match.aoPenalties || 0}/5)</span>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function clearHistory() {
      if(confirm("Sei sicuro di voler eliminare tutto lo storico?")) {
        localStorage.removeItem('karateHistory');
        renderHistory();
      }
    }
  </script>
</body>
</html>
